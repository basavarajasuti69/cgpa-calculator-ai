compatibility_date = "2026-10-19"
compatibility_flags = ["global_fetch_strictly_public"]
name = "cgpa-calculator-ai"
main = "@astrojs/cloudflare/entrypoints/server"
observability = { enabled = true }

[assets]
directory = "./dist"
binding = "ASSETS"

[[rules]]
  source = "https://www.cgpacalculatorai.com/*"
  destination = "https://cgpacalculatorai.com/:splat"
  status = 301
