name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Validate data configs
        run: npx tsx scripts/validate-data.ts

      - name: Build site
        run: npm run build

      - name: Run unit tests (vitest)
        run: npm test

      - name: Run Playwright e2e tests
        run: npx playwright test

      - name: Lighthouse mobile audit
        run: |
          npx serve dist/client -l 5173 &
          sleep 3
          npx lighthouse http://localhost:5173 --preset=desktop --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=./lighthouse-report.json || true
          npx serve dist/client -l 5174 &
          sleep 3
          npx lighthouse http://localhost:5174 --preset=mobile --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=./lighthouse-mobile.json || true
