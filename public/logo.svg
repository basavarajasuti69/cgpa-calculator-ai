<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <style>
      .logo-bg { fill: #f8f7f3; }
      .logo-mark { stroke: #0d2442; fill: none; }
      @media (prefers-color-scheme: dark) {
        .logo-bg { fill: #0a0a0a; }
        .logo-mark { stroke: #ffffff; }
      }
    </style>
  </defs>
  <rect class="logo-bg" x="2" y="2" width="28" height="28" rx="8" ry="8"/>
  <!-- Sigma mark Σ -->
  <path class="logo-mark"
    d="M 7 8 L 25 8 M 25 8 L 9 24 M 9 24 L 25 24"
    stroke-width="4"
    stroke-linecap="round"
    stroke-linejoin="round"/>
</svg>
